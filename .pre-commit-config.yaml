---
# For setup instructions see the backend onboarding doc.
# https://git.opentalk.dev/a.weiche/the-knowledge/-/blob/main/backend-onboarding.md?ref_type=heads#pre-commit
exclude: target/|.*\.snap|.*.sql

repos:
  # These are "general" hooks provided by the pre-commit devs
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
  # A repo containing hooks for certain cargo subcommands
  # Used for tools that don't bring official hooks
  # Maybe we should create such a "dummy" project ourselves
  - repo: https://github.com/AndrejOrsula/pre-commit-cargo
    rev: 0.5.0
    hooks:
      - id: cargo-fmt
        entry: cargo +nightly fmt
      - id: cargo-clippy
        args:
          - --all-targets
          - --all-features
          - --tests
          - --
          - --deny
          - warnings
      - id: cargo-doc
        args:
          - --workspace
          - --no-deps
          - --all-features
  - repo: https://github.com/EmbarkStudios/cargo-deny
    rev: 0.20.2
    hooks:
      - id: cargo-deny
        args:
          - --all-features
          - --workspace
          - check
          - --deny
          - unmatched-skip
          - --deny
          - license-not-encountered
          - --deny
          - license-exception-not-encountered
          - --deny
          - advisory-not-detected
          - --hide-inclusion-graph
  - repo: https://github.com/bnjbvr/cargo-machete
    rev: 6ddd489
    hooks:
      - id: cargo-machete
        args:
          - --with-metadata
  - repo: https://github.com/weichweich/olpat
    rev: v0.10.0
    hooks:
      - id: olpat-format
      - id: olpat-lint
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        exclude: ^api/docs/openapi\.yml$
        args:
          - .
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse-lint-file
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.0
    hooks:
      - id: markdownlint-cli2-docker
        args:
          - --warnings
  # No official hooks for commitlint available, this one seems actively maintained
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.26.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
  - repo: https://github.com/daveshanley/vacuum
    rev: v0.19.4
    hooks:
      - id: vacuum
        files: ^api/.*\.(json|ya?ml)$
        args:
          - --ruleset
          - ci/spectral/openapi.yml
