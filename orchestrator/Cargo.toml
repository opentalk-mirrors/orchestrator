[package]
name = "opentalk-orchestrator"
description = "OpenTalk Orchestrator Service"
version.workspace = true
publish = false
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["original-uri"] }
bytes.workspace = true
clap.workspace = true
config.workspace = true
dirs.workspace = true
futures-util.workspace = true
jsonwebtoken = { workspace = true, features = ["aws-lc-rs"] }
opentalk-orchestrator-shared = { version = "=0.4.1", features = [
  "recording-service",
  "roomserver-service",
  "transcription-service",
] }
opentalk-roomserver-types.workspace = true
opentalk-roomserver-web-api.workspace = true
opentalk-service-auth = { workspace = true, features = ["axum", "default"] }
opentalk-types-api-common = { workspace = true, features = ["http", "serde"] }
opentalk-types-common.workspace = true
reqwest.workspace = true
rustls = { workspace = true, features = ["aws-lc-rs"] }
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
service-probe.workspace = true
service-probe-client.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "signal",
] }
tokio-tungstenite = { workspace = true, features = ["stream", "connect"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
test-log.workspace = true

[lints]
workspace = true
