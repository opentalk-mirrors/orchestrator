[package]
name = "opentalk-orchestrator"
description = "OpenTalk Orchestrator Service"
version = "0.10.0"
publish = false
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
anstream = "1.0.0"
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["original-uri"] }
bytes.workspace = true
clap.workspace = true
config.workspace = true
dirs.workspace = true
futures-util.workspace = true
jsonwebtoken = { workspace = true, features = ["aws-lc-rs"] }
livekit-api.workspace = true
opentalk-orchestrator-shared = { version = "0.10.0", features = [
  "recording-service",
  "roomserver-service",
  "transcription-service",
] }
opentalk-recorder-web-api.workspace = true
opentalk-roomserver-types.workspace = true
opentalk-roomserver-web-api.workspace = true
opentalk-service-auth = { workspace = true, features = ["axum", "default"] }
opentalk-transcription-web-api.workspace = true
opentalk-types-api-common = { version = "0.9.0", features = ["http", "serde"] }
opentalk-types-api-internal = "0.3"
opentalk-types-common = { version = "0.46.0", default-features = false, features = [
  "serde",
] }
owo-colors.workspace = true
reqwest = { workspace = true, features = ["stream"] }
rustls = { workspace = true, features = ["aws-lc-rs"] }
serde.workspace = true
serde_ignored.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
service-probe.workspace = true
service-probe-client.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "signal",
] }
tokio-tungstenite = { workspace = true, features = ["stream", "connect"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
test-log.workspace = true

[lints]
workspace = true
