[workspace]
members = ["orchestrator", "orchestrator-shared", "orchestrator-client"]
resolver = "2"

[workspace.package]
authors = ["OpenTalk Team <mail@opentalk.eu>"]
edition = "2024"
homepage = "https://opentalk.eu/"
repository = "https://gitlab.opencode.de/opentalk/orchestrator"
version = "0.4.1"
license = "EUPL-1.2"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["http2", "ws"] }
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
config = "0.15"
dirs = "6.0"
env = "1.0"
futures-util = "0.3"
jsonwebtoken = { version = "10", default-features = false }
log = "0.4"
opentalk-orchestrator-shared = { path = "./orchestrator-shared", version = "0.4" }
opentalk-roomserver-types = "0.0.32"
opentalk-roomserver-web-api = "0.0.32"
opentalk-service-auth = { version = "0.2.2", default-features = false }
opentalk-types-api-common = "0.7.0"
opentalk-types-api-v1 = { version = "0.56", default-features = false, features = [
  "http",
] }
opentalk-types-common = { version = "0.43", default-features = false, features = [
  "serde",
] }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
] }
rustls = { version = "0.23", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
service-probe = "0.4"
service-probe-client = "0.4"
test-log = "0.2"
thiserror = "2.0"
tokio = { version = "1.51", default-features = false }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
  "rustls",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tungstenite = { version = "0.29", default-features = false, features = [
  "rustls",
] }
url = "2.5"

[workspace.lints.clippy]
self_named_module_files = "deny"
