[workspace]
members = ["orchestrator", "orchestrator-shared", "orchestrator-client"]
resolver = "2"

[workspace.package]
authors = ["OpenTalk Team <mail@opentalk.eu>"]
edition = "2024"
homepage = "https://opentalk.eu/"
repository = "https://gitlab.opencode.de/opentalk/orchestrator"
license = "EUPL-1.2"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["http2", "ws"] }
bytes = "1.10"
env = "1.0"
futures-util = "0.3"
log = "0.4"
url = "2.5"
opentalk-roomserver-types = "0.0.14"
opentalk-roomserver-web-api = "0.0.14"
opentalk-types = { version = "0.54", default-features = false }
opentalk-types-api-v1 = { version = "0.46", default-features = false }
opentalk-types-common = { version = "0.39", default-features = false, features = [
  "serde",
] }
opentalk-types-api-common = "0.3.0"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
opentalk-orchestrator-shared.path = "./orchestrator-shared"
thiserror = "2.0"
tokio = { version = "1.47", default-features = false }
tokio-tungstenite = { version = "0.28", default-features = false, features = [
  "rustls",
] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tungstenite = { version = "0.28", default-features = false, features = [
  "rustls",
] }
test-log = "0.2"

[workspace.lints.clippy]
self_named_module_files = "deny"
